<VirtualHost *:80>
    WSGIDaemonProcess ATI python-path=/var/www/ATI
    WSGIScriptAlias / /var/www/ATI/app.py

    <Directory /var/www/ATI>
        WSGIProcessGroup ATI
        WSGIApplicationGroup %{GLOBAL}
        Require all granted
    </Directory>

    Alias /static/ /var/www/ATI/static/
    <Directory /var/www/ATI/static>
        Require all granted
    </Directory>
</VirtualHost>
